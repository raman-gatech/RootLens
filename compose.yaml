name: rootlens

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  rootlens-db:
    image: pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_DB: ${ROOTLENS_POSTGRES_DB}
      POSTGRES_USER: ${ROOTLENS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ROOTLENS_POSTGRES_PASSWORD}
    volumes:
      - rootlens-postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROOTLENS_POSTGRES_USER} -d ${ROOTLENS_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  rootlens-api:
    build:
      context: ${ROOTLENS_PROJECT_DIR}
      dockerfile: Dockerfile
    environment:
      ROOTLENS_DATABASE_URL: ${ROOTLENS_DATABASE_URL}
      ROOTLENS_ENVIRONMENT: ${ROOTLENS_ENVIRONMENT}
      ROOTLENS_LOG_LEVEL: ${ROOTLENS_LOG_LEVEL}
      ROOTLENS_OTLP_ENDPOINT: ${ROOTLENS_OTLP_ENDPOINT}
      ROOTLENS_TELEMETRY_ENABLED: ${ROOTLENS_TELEMETRY_ENABLED}
      ROOTLENS_PROMETHEUS_URL: ${ROOTLENS_PROMETHEUS_URL}
      ROOTLENS_TEMPO_URL: ${ROOTLENS_TEMPO_URL}
      ROOTLENS_LOKI_URL: ${ROOTLENS_LOKI_URL}
      ROOTLENS_KUBERNETES_URL: ${ROOTLENS_KUBERNETES_URL:-https://kubernetes:16443}
      ROOTLENS_KUBERNETES_TOKEN_FILE: /run/rootlens/kubernetes/token
      ROOTLENS_KUBERNETES_CA_FILE: /run/rootlens/kubernetes/ca.crt
      ROOTLENS_AGENT_PROVIDER: ${ROOTLENS_AGENT_PROVIDER:-deterministic}
      ROOTLENS_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ROOTLENS_OPENAI_MODEL: ${ROOTLENS_OPENAI_MODEL:-gpt-5.4-mini}
      ROOTLENS_REMEDIATION_EXECUTION_ENABLED: ${ROOTLENS_REMEDIATION_EXECUTION_ENABLED:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${ROOTLENS_PROJECT_DIR}/.runtime/kubernetes:/run/rootlens/kubernetes:ro
    extra_hosts:
      - "kubernetes:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      rootlens-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    command:
      - --config=/etc/rootlens/otel-collector.yaml
    volumes:
      - ${ROOTLENS_PROJECT_DIR}/infrastructure/otel-collector/config.yaml:/etc/rootlens/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started

  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ${ROOTLENS_PROJECT_DIR}/infrastructure/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ${ROOTLENS_PROJECT_DIR}/infrastructure/tempo/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ${ROOTLENS_PROJECT_DIR}/infrastructure/loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ${ROOTLENS_PROJECT_DIR}/infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  rootlens-postgres-data:
  tempo-data:
