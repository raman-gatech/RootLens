name: OpenAI Live Evaluation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openai-live-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hundred-live-openai-incidents:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Require protected OpenAI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo "Repository secret OPENAI_API_KEY is required" >&2
            exit 1
          }
          install -m 600 /dev/null "$RUNNER_TEMP/rootlens-openai-api-key"
          printf '%s' "$OPENAI_API_KEY" > "$RUNNER_TEMP/rootlens-openai-api-key"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap
        run: make bootstrap

      - name: Start observability and native AMD64 Kubernetes stacks
        run: make k8s-up

      - name: Connect Kubernetes telemetry exporter to the host collector
        run: |
          gateway=$(docker inspect rootlens-control-plane --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}')
          test -n "$gateway"
          kubectl --context kind-rootlens --namespace otel-demo patch deployment otel-collector \
            --type merge \
            --patch "{\"spec\":{\"template\":{\"spec\":{\"hostAliases\":[{\"ip\":\"$gateway\",\"hostnames\":[\"host.docker.internal\"]}]}}}}"
          kubectl --context kind-rootlens --namespace otel-demo rollout status deployment/otel-collector --timeout=5m
          for attempt in $(seq 1 30); do
            echo "Telemetry convergence attempt ${attempt}/30"
            if make gateway-smoke topology-smoke; then
              exit 0
            fi
            sleep 5
          done
          echo "Telemetry did not converge within 150 seconds" >&2
          exit 1

      - name: Run 100 confirmed incidents with real OpenAI baselines
        env:
          GROUND_TRUTH_DIR: ${{ runner.temp }}/rootlens-ground-truth
        run: |
          install -d -m 700 "$GROUND_TRUTH_DIR"
          .venv/bin/python -m evaluation_harness.live_cli \
            --context kind-rootlens \
            --base-url http://127.0.0.1:8000 \
            --ground-truth-dir "$GROUND_TRUTH_DIR" \
            --repetitions 5 \
            --duration 5 \
            --settle-seconds 2 \
            --openai-api-key-file "$RUNNER_TEMP/rootlens-openai-api-key" \
            --openai-model gpt-5.4-mini-2026-03-17 \
            --output docs/evaluation-live-openai-results.json \
            --publish
          PYTHONPATH="$PWD" .venv/bin/python scripts/verify_ground_truth.py \
            "$GROUND_TRUTH_DIR" --expected-experiments 100
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("docs/evaluation-live-openai-results.json")
          report_text = report_path.read_text()
          report = json.loads(report_text)
          expected_methods = {
              "A_alert_only",
              "B_single_llm",
              "C_retrieval_agent",
              "D_multi_agent",
              "E_rootlens",
          }
          assert report["dataset_version"] == "rootlens-chaos-live-openai-v1"
          assert report["execution_mode"] == "live"
          assert report["fault_type_count"] == 20
          assert report["repetitions_per_fault"] == 5
          assert report["incident_count"] == 100
          assert set(report["methods"]) == expected_methods
          assert all(item["trials"] == 100 for item in report["methods"].values())
          assert report["methods"]["A_alert_only"]["mean_llm_calls"] == 0
          for method in expected_methods - {"A_alert_only"}:
              assert report["methods"][method]["mean_llm_calls"] > 0
              assert report["methods"][method]["mean_input_tokens"] > 0
              assert report["methods"][method]["mean_output_tokens"] > 0
              assert report["methods"][method]["estimated_cost_usd"] > 0
          assert "ground_truth" not in report_text
          PY

      - name: Upload aggregate OpenAI evaluation
        uses: actions/upload-artifact@v4
        with:
          name: rootlens-openai-live-evaluation-${{ github.run_id }}
          path: docs/evaluation-live-openai-results.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish aggregate OpenAI evaluation to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evaluation-live-openai-results.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish 100-incident OpenAI live evaluation"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Preserve diagnostics on failure
        if: failure()
        run: |
          docker compose --project-name rootlens \
            --env-file vendor/opentelemetry-demo/.env \
            --env-file .env.compose \
            -f vendor/opentelemetry-demo/compose.yaml \
            -f compose.yaml logs --tail=500 rootlens-api otel-collector loki prometheus tempo || true
          kubectl --context kind-rootlens --namespace otel-demo logs deployment/otel-collector \
            --tail=500 || true
          kubectl --context kind-rootlens get pods --all-namespaces --output wide || true
          kubectl --context kind-rootlens get podchaos,stresschaos,networkchaos,httpchaos,dnschaos,iochaos,timechaos \
            --all-namespaces --output yaml || true
          kubectl --context kind-rootlens --namespace chaos-mesh logs deployment/chaos-controller-manager \
            --tail=500 || true

      - name: Remove secrets and ephemeral infrastructure
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/rootlens-openai-api-key"
          make k8s-down || true
          make down || true
