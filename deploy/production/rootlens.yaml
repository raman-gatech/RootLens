apiVersion: v1
kind: Namespace
metadata:
  name: rootlens-system
  labels:
    app.kubernetes.io/part-of: rootlens
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rootlens-api
  namespace: rootlens-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rootlens-production-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rootlens-production-reader
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rootlens-production-reader
subjects:
  - kind: ServiceAccount
    name: rootlens-api
    namespace: rootlens-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rootlens-config
  namespace: rootlens-system
data:
  ROOTLENS_ENVIRONMENT: production
  ROOTLENS_AUTH_ENABLED: "true"
  ROOTLENS_AUTH_CREDENTIALS_FILE: /run/secrets/rootlens-auth/credentials.json
  ROOTLENS_TRUSTED_HOSTS: '["rootlens.example.com"]'
  ROOTLENS_DOCS_ENABLED: "false"
  ROOTLENS_TELEMETRY_ENABLED: "true"
  ROOTLENS_OTLP_ENDPOINT: http://otel-collector.observability.svc:4317
  ROOTLENS_PROMETHEUS_URL: http://prometheus.observability.svc:9090
  ROOTLENS_TEMPO_URL: http://tempo.observability.svc:3200
  ROOTLENS_LOKI_URL: http://loki.observability.svc:3100
  ROOTLENS_KUBERNETES_NAMESPACE: default
  ROOTLENS_REMEDIATION_EXECUTION_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootlens-api
  namespace: rootlens-system
  labels: &labels
    app.kubernetes.io/name: rootlens-api
    app.kubernetes.io/part-of: rootlens
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: rootlens-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      containers:
        - name: api
          # Replace with an immutable registry digest during release promotion.
          image: ghcr.io/raman-gatech/rootlens@sha256:REPLACE_WITH_64_HEX_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rootlens-config
          env:
            - name: ROOTLENS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rootlens-runtime
                  key: database-url
            - name: ROOTLENS_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rootlens-runtime
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders: &probe-host
                - name: Host
                  value: rootlens.example.com
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders: *probe-host
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders: *probe-host
            periodSeconds: 3
            failureThreshold: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/rootlens-auth
              readOnly: true
            - name: kubernetes-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: rootlens-auth
            defaultMode: 0440
        - name: kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rootlens-api
  namespace: rootlens-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rootlens-api
    app.kubernetes.io/part-of: rootlens
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rootlens-api
  namespace: rootlens-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rootlens-api
      app.kubernetes.io/part-of: rootlens
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rootlens-api
  namespace: rootlens-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rootlens-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rootlens-api-ingress
  namespace: rootlens-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rootlens-api
      app.kubernetes.io/part-of: rootlens
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              rootlens.io/api-access: "true"
      ports:
        - protocol: TCP
          port: 8000
