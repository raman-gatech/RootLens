apiVersion: batch/v1
kind: Job
metadata:
  name: rootlens-migrate
  namespace: rootlens-system
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/raman-gatech/rootlens:1.0.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: rootlens-config
          env:
            - name: ROOTLENS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rootlens-runtime
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/rootlens-auth
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: rootlens-auth
            defaultMode: 0440
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
