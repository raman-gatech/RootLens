apiVersion: v1
kind: ServiceAccount
metadata:
  name: rootlens-reader
  namespace: rootlens
---
apiVersion: v1
kind: Secret
metadata:
  name: rootlens-reader-token
  namespace: rootlens
  annotations:
    kubernetes.io/service-account.name: rootlens-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rootlens-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rootlens-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rootlens-reader
subjects:
  - kind: ServiceAccount
    name: rootlens-reader
    namespace: rootlens
