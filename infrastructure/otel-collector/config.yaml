receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 300
    spike_limit_mib: 60
  batch:
    send_batch_size: 1024
    timeout: 5s
  resource/rootlens:
    attributes:
      - key: rootlens.telemetry_pipeline
        value: local-compose
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/rootlens, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/rootlens, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/rootlens, batch]
      exporters: [otlp_http/loki]
