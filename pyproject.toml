[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rootlens"
version = "1.0.1"
description = "Graph-grounded incident diagnosis and remediation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "networkx>=3.6,<4",
  "numpy>=2.5,<3",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.31,<2",
  "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
  "opentelemetry-sdk>=1.31,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.9,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest-playwright>=0.9,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.11,<1",
  "types-networkx>=3.6.1,<4",
  "types-PyYAML>=6.0.12,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rootlens = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests/unit"]
markers = ["e2e: browser-driven end-to-end tests"]

[tool.ruff]
extend-exclude = ["vendor"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rootlens", "experiment_controller", "evaluation_harness"]
